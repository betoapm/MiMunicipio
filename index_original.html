function downloadCSV(filename,rows){if(!rows.length){toast('No hay datos para exportar.','error');return}const keys=Object.keys(rows[0]);const quote=v=>'\"'+String(v??'').replace(/\"/g,'\"\"')+'\"';const csv='\ufeff'+[keys.map(quote).join(','),...rows.map(r=>keys.map(k=>quote(r[k])).join(','))].join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);toast('Archivo CSV exportado.');}
function downloadCompleteBackup(){if(state.mode!=='admin'){toast('Solo el administrador puede descargar el respaldo completo.','error');return}const safeUsers=state.users.map(({password,...u})=>({...u,password:'[no exportada]'}));const safeCitizens=(state.citizens||[]).map(({password,...u})=>({...u,password:'[no exportada]'}));const bundle={application:'Mi Municipio',formatVersion:1,createdAt:new Date().toISOString(),notice:'Respaldo sensible. Las contraseñas no se exportan.',reports:state.reports,users:safeUsers,citizens:safeCitizens,departments:DEPARTMENTS,rules:state.rules,audit:state.audit,settings:state.settings};const blob=new Blob([JSON.stringify(bundle,null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`mi_municipio_respaldo_${new Date().toISOString().slice(0,10)}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);addAudit('Respaldo completo JSON descargado',`${state.reports.length} reportes`);toast('Respaldo completo solicitado. Conserva el archivo en una ubicación protegida.')}
function importReportsCSV(file){const reader=new FileReader();reader.onload=()=>{try{const lines=String(reader.result||'').replace(/^\ufeff/,'').split(/\r?\n/).filter(Boolean);if(lines.length<2)throw new Error('El CSV no contiene filas.');const parse=line=>{const out=[];let v='',q=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='\"'&&q&&line[i+1]==='\"'){v+='\"';i++}else if(c==='\"')q=!q;else if(c===','&&!q){out.push(v);v=''}else v+=c}out.push(v);return out};const heads=parse(lines[0]).map(x=>x.trim().toLowerCase());const get=(obj,...names)=>{for(const n of names){const i=heads.indexOf(n);if(i>=0)return obj[i]||''}return ''};let count=0;for(const line of lines.slice(1)){const c=parse(line);const folio=get(c,'folio','id');if(!folio)continue;let importedNotes=[];try{importedNotes=JSON.parse(get(c,'anotaciones_json','notes_json')||'[]');if(!Array.isArray(importedNotes))importedNotes=[];}catch{importedNotes=[];}const coordsCsv=get(c,'coordenadas','coords')||[get(c,'latitud','latitude'),get(c,'longitud','longitude')].filter(Boolean).join(', ');const report={id:folio,category:get(c,'categoria','category')||'Otro',title:get(c,'titulo','title')||get(c,'categoria','category')||'Otro',description:get(c,'descripcion','description'),department:get(c,'dependencia','department')||'Mesa de Control Municipal',status:get(c,'estado','status')||'Recibido',location:get(c,'ubicacion','location'),coords:coordsCsv,created:get(c,'fecha','created')||nowDate(),updated:get(c,'actualizado','updated')||nowDate(),citizen:get(c,'ciudadano','citizen'),contact:get(c,'contacto','contact'),image:get(c,'foto_data_url','imagen')||'',notes:importedNotes};const ix=state.reports.findIndex(r=>r.id===folio);if(ix>=0)state.reports[ix]={...state.reports[ix],...report};else state.reports.push(report);state.backupExportedIds=state.backupExportedIds.filter(id=>id!==folio);count++}persist();addAudit('Importación CSV de Access',count+' reportes');render();toast('Importados o actualizados '+count+' repo function handleClick(e){const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;if(state.authenticatedUser&&!['logout','go','mode','staff-login','citizen-login','citizen-register','citizen-home','welcome'].includes(a))addAudit('Acción: '+a,el.dataset.id||el.dataset.page||state.page);switch(a){case'forgot-password':{const identity=prompt('Escribe el correo electrónico registrado en esta cuenta:');if(!identity)break;const citizen=(state.citizens||[]).find(c=>(c.email||'').toLowerCase()===identity.trim().toLowerCase()&&c.active!==false);if(!citizen){toast('No se encontró una cuenta activa con ese correo.','error');break;}const np=prompt('Crea una contraseña nueva de al menos 8 caracteres. En esta versión se actualiza en este navegador:');if(!np)break;if(np.length<8){toast('La contraseña debe tener al menos 8 caracteres.','error');break;}citizen.password=np;persist();addAudit('Restablecimiento local de contraseña ciudadana',citizen.email);toast('Contraseña actualizada en este navegador. Para restablecimiento verificado por correo se requiere un servicio de autenticación.');break;}case'delete-own-account':{if(!state.authenticatedUser||state.authenticatedUser.role!=='Ciudadano'){toast('Solo una cuenta ciudadana puede solicitar su eliminación.','error');break;}if(!confirm('¿Eliminar definitivamente tu cuenta ciudadana de este navegador? Esta acción no se puede deshacer.'))break;const email=state.authenticatedUser.email;state.citizens=(state.citizens||[]).filter(c=>c.email!==email);persist();addAudit('Cuenta ciudadana eliminada por el titular',email);state.authenticatedUser=null;state.mode='citizen';state.page='welcome';render();toast('La cuenta fue eliminada de este navegador.');break;}case'admin-delete-citizen':{if(state.mode!=='admin'){toast('Solo el administrador municipal puede eliminar cuentas ciudadanas.','error');break;}const idx=Number(el.dataset.index),c=state.citizens[idx];if(!c)break;if(!confirm(`¿Eliminar la cuenta ciudadana ${c.name}
